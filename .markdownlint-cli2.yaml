# Relaxed markdownlint config: catch structural mistakes, not style nits.
config:
  default: true
  MD013: false # line length: prose is wrapped by hand, tables and URLs run long
  MD024:
    siblings_only: true # repeated headings are fine under different parents
  MD033: false # inline HTML
  MD041: false # first line needn't be a heading (SKILL.md starts with frontmatter)
  MD060: false # table column alignment

ignores:
  - "node_modules/**"
